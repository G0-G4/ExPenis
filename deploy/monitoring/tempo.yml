server:
  http_listen_port: 3200
  http_listen_address: 0.0.0.0
  grpc_listen_address: 127.0.0.1
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
ingester:
  trace_idle_period: 1s
  max_block_duration: 1m
compactor:
  compaction:
    block_retention: 168h
storage:
  trace:
    backend: local
    wal:
      path: /data/wal
    local:
      path: /data/blocks
querier:
  max_concurrent_queries: 2
query_frontend:
  search:
    concurrent_jobs: 2
