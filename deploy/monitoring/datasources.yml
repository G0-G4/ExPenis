apiVersion: 1
datasources:
  - name: ExPenis logs
    uid: expenis-logs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://127.0.0.1:9428
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: expenis-traces
          url: '$${__value.raw}'
  - name: ExPenis traces
    uid: expenis-traces
    type: tempo
    access: proxy
    url: http://127.0.0.1:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: expenis-logs
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        customQuery: true
        query: 'environment:="$${__span.tags.environment}" trace_id:="$${__trace.traceId}"'
