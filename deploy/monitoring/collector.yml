receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 112
    spike_limit_mib: 16
  transform:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "environment", "platform", "origin"])
      - context: span
        statements:
          - keep_keys(attributes, ["operation", "route", "method", "status", "code", "provider", "request_id"])
          - set(status.message, "")
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "environment", "platform", "origin"])
      - context: log
        statements:
          - keep_keys(attributes, ["code", "frames", "fingerprint", "request_id", "route", "method", "status", "event_id", "trace_id", "span_id", "app_version"])
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 128
exporters:
  otlphttp/logs:
    logs_endpoint: ${env:VL_LOGS_ENDPOINT}
    timeout: 2s
    sending_queue:
      queue_size: 16
    retry_on_failure:
      initial_interval: 500ms
      max_interval: 1s
      max_elapsed_time: 5s
  otlphttp/traces:
    traces_endpoint: ${env:TEMPO_TRACES_ENDPOINT}
    timeout: 2s
    sending_queue:
      queue_size: 16
    retry_on_failure:
      initial_interval: 500ms
      max_interval: 1s
      max_elapsed_time: 5s
service:
  telemetry:
    logs:
      level: error
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform, batch]
      exporters: [otlphttp/traces]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform, batch]
      exporters: [otlphttp/logs]
