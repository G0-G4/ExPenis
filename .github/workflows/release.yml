name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Check release notes
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release tag"; exit 1; }
          version=$(awk '/^version:/ {split($2, parts, "+"); print parts[1]}' frontend/pubspec.yaml)
          test "$RELEASE_TAG" = "v$version" || { echo "::error::Tag does not match pubspec version"; exit 1; }
          notes="release-notes/${RELEASE_TAG}.md"
          test -s "$notes" || { echo "::error::$notes is missing or empty"; exit 1; }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.4"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > frontend/android/app/expenis-release.jks

      - name: Create key.properties
        run: |
          cat > frontend/android/key.properties << 'EOF'
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          storeFile=../app/expenis-release.jks
          EOF

      - name: Download Flutter dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Read version from tag
        id: version
        run: echo "tag=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release
        working-directory: frontend

      - name: Rename APK
        run: |
          mv frontend/build/app/outputs/flutter-apk/app-release.apk \
             "ExPenis-${{ steps.version.outputs.tag }}.apk"

      - name: Build release web
        run: flutter build web --release
        working-directory: frontend

      - name: Package web bundle
        run: |
          versioned="ExPenis-${{ steps.version.outputs.tag }}-web.zip"
          (cd frontend/build/web && zip -r "$GITHUB_WORKSPACE/$versioned" .)
          # Stable name for curl /releases/latest/download/ExPenis-web.zip
          cp "$versioned" ExPenis-web.zip

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes/${{ env.RELEASE_TAG }}.md
          files: |
            ExPenis-${{ steps.version.outputs.tag }}.apk
            ExPenis-${{ steps.version.outputs.tag }}-web.zip
            ExPenis-web.zip
